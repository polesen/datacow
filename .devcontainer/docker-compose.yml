services:
  dev:
    image: mcr.microsoft.com/devcontainers/base:ubuntu
    volumes:
      - ..:/workspace:cached
      - ~/.claude/CLAUDE.md:/etc/claude/CLAUDE.md:ro
    env_file:
      - ../.env.local
    environment:
      DISABLE_AUTOUPDATER: "1"
    command: sleep infinity
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: datacow
      POSTGRES_PASSWORD: datacow
      POSTGRES_DB: datacow_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datacow"]
      interval: 5s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8
    environment:
      MYSQL_USER: datacow
      MYSQL_PASSWORD: datacow
      MYSQL_DATABASE: datacow_test
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "datacow", "-pdatacow"]
      interval: 5s
      timeout: 5s
      retries: 10
