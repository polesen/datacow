services:
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: datacow
      POSTGRES_PASSWORD: datacow
      POSTGRES_DB: datacow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datacow"]
      interval: 5s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8
    ports:
      - "3306:3306"
    environment:
      MYSQL_USER: datacow
      MYSQL_PASSWORD: datacow
      MYSQL_DATABASE: datacow
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "datacow", "-pdatacow"]
      interval: 5s
      timeout: 5s
      retries: 10
