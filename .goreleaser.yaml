# GoReleaser configuration — https://goreleaser.com
# Builds cross-platform binaries on each `v*` tag, publishes a GitHub Release
# with a SHA256 checksums file, and bumps the Homebrew formula in the tap repo.
version: 2

project_name: datacow

before:
  hooks:
    - go mod tidy

builds:
  - id: datacow
    main: ./cmd
    binary: datacow
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: datacow
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

# A Homebrew Cask (not a Formula) — Casks are the correct abstraction for
# prebuilt binaries; GoReleaser deprecated `brews` in favour of this.
homebrew_casks:
  - name: datacow
    repository:
      owner: polesen
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/polesen/datacow"
    description: "Zero-config terminal database explorer — like k9s or lazygit, but for databases"
    # Only publish for stable, non-prerelease tags.
    skip_upload: auto
    commit_author:
      name: goreleaser-bot
      email: goreleaser-bot@users.noreply.github.com
    # Release binaries are unsigned. Homebrew Casks quarantine their downloads,
    # so strip the quarantine attribute on install to avoid a macOS Gatekeeper
    # block — no Apple Developer signing/notarization required.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/datacow"]
          end

release:
  draft: false
  prerelease: auto
