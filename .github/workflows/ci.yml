name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: datacow
          POSTGRES_PASSWORD: datacow
          POSTGRES_DB: datacow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U datacow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      mysql:
        image: mysql:8
        env:
          MYSQL_USER: datacow
          MYSQL_PASSWORD: datacow
          MYSQL_DATABASE: datacow
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -u root -proot --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_POSTGRES_DSN: postgres://datacow:datacow@127.0.0.1:5432/datacow?sslmode=disable
      TEST_MYSQL_DSN: datacow:datacow@tcp(127.0.0.1:3306)/datacow

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install tools
        run: |
          go install gotest.tools/gotestsum@latest
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Build
        run: go build ./...

      - name: Lint
        run: make lint

      - name: Staticcheck
        run: staticcheck ./...

      - name: Test
        run: make test

  # Verifies the release plumbing without cutting a release: lints all workflows,
  # then renders the Homebrew formula with the shared generator and actually
  # builds + installs + tests it from source via Homebrew on Linux. The formula
  # is OS-agnostic (pure Go, no cask/xattr), so a Linux install faithfully
  # exercises SHA256 verification, the `go build` + version ldflags, and the
  # formula's own `test` block — no macOS runner needed.
  formula:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # git archive needs the tagged/HEAD tree

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # ubuntu-latest does not put Homebrew on PATH for job steps; set it up
      # explicitly so the brew style/install/test steps below can run on Linux.
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      # Lint the workflows this release pipeline owns. (The claude.* workflows
      # have separate, pre-existing findings tracked outside this PR.)
      - name: Lint workflows (actionlint)
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          "$(go env GOPATH)/bin/actionlint" .github/workflows/ci.yml .github/workflows/release.yml

      - name: Build source tarball
        id: tarball
        run: |
          version="0.0.0"
          tarball="datacow-${version}.tar.gz"
          git archive --format=tar.gz --prefix="datacow-${version}/" -o "$tarball" HEAD
          {
            echo "sha256=$(sha256sum "$tarball" | cut -d' ' -f1)"
            echo "path=$PWD/$tarball"
          } >>"$GITHUB_OUTPUT"

      - name: Render formula
        run: |
          bash scripts/gen-formula.sh \
            "file://${{ steps.tarball.outputs.path }}" \
            "${{ steps.tarball.outputs.sha256 }}" > datacow.rb
          cat datacow.rb

      - name: Set up local tap
        run: |
          tap="$(brew --repository local/test)"
          mkdir -p "$tap/Formula"
          cp datacow.rb "$tap/Formula/datacow.rb"

      - name: Lint formula style
        run: brew style local/test/datacow

      # Homebrew's Linux build sandbox needs a working rootless bwrap, which
      # GitHub's ubuntu-latest runners block via AppArmor's unprivileged
      # userns restriction. The runner itself is already an isolated,
      # ephemeral sandbox, so disable Homebrew's nested one.
      - name: Build, install and test from source
        env:
          HOMEBREW_NO_SANDBOX_LINUX: "1"
        run: |
          brew install --build-from-source --verbose local/test/datacow
          brew test local/test/datacow
          datacow --version
