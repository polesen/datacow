name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Only run for the repo owner / org members / collaborators. On a public
    # repo this prevents anyone from triggering Claude with an `@claude` comment
    # and spending the maintainer's subscription tokens.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: datacow
          POSTGRES_PASSWORD: datacow
          POSTGRES_DB: datacow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U datacow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      mysql:
        image: mysql:8
        env:
          MYSQL_USER: datacow
          MYSQL_PASSWORD: datacow
          MYSQL_DATABASE: datacow
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -u root -proot --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_POSTGRES_DSN: postgres://datacow:datacow@127.0.0.1:5432/datacow?sslmode=disable
      TEST_MYSQL_DSN: datacow:datacow@tcp(127.0.0.1:3306)/datacow

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Go tools
        run: |
          go install gotest.tools/gotestsum@latest
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          custom_instructions: |
            Before doing any work, read CLAUDE.md in the repo root. It contains all architectural decisions, conventions, and rules that must be followed.

            When implementing a task from tasks/ready/ or tasks/drafts/, follow the Definition of Done checklist in .claude/skills/done/SKILL.md exactly and in order. Do not report the task complete until all steps have passed. The checklist ends with moving the task file to tasks/done/, committing, pushing the branch, and opening a PR — these are mandatory, not optional.
          claude_args: >-
            --allowedTools
            Read,Edit,Write,Glob,Grep,
            Bash(go build*),
            Bash(go test*),
            Bash(gotestsum*),
            Bash(make*),
            Bash(staticcheck*),
            Bash(golangci-lint*),
            Bash(git *),
            Bash(gh *)

